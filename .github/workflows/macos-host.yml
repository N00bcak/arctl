name: macOS host sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-sandbox:
    runs-on: [self-hosted, macOS]
    env:
      ARCTL_HOST_SANDBOX_TEST: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v10
      - run: python -m pip install --editable .
      - run: python -m arctl doctor --json
      - run: python -m unittest tests.test_sandbox_host -v
